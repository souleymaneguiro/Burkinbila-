<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burkinbila- — Espace Vidéo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.55);
      font-size: 17px;
      font-weight: bold;
    }
    .feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }
    .video-slide {
      position: relative;
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .caption {
      position: absolute;
      bottom: 28px;
      left: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="header">Burkinbila- — Espace Vidéo</div>

  <div class="feed">
    <div class="video-slide">
      <video controls playsinline loop preload="metadata">
        <source src="VOTRE_LIEN_VIDEO_1.mp4" type="video/mp4" />
      </video>
      <div class="caption">Première vidéo test</div>
    </div>

    <div class="video-slide">
      <video controls playsinline loop preload="metadata">
        <source src="VOTRE_LIEN_VIDEO_2.mp4" type="video/mp4" />
      </video>
      <div class="caption">Deuxième vidéo</div>
    </div>
  </div>
</body>
</html>
